apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.demo.mycompany.com
spec:
  group: demo.mycompany.com
  scope: Namespaced
  names:
    plural: apps
    singular: app
    kind: App
    shortNames:
      - app
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                replicas:
                  type: integer

